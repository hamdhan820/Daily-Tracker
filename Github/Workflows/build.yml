@@ -0,0 +1,33 @@name: Build APKon:  workflow_dispatch:  push:    branches: [main, master]jobs:  build:    runs-on: ubuntu-latest    steps:      - uses: actions/checkout@v4      - uses: actions/setup-node@v4        with:          node-version: 20      - uses: actions/setup-java@v4        with:          distribution: temurin          java-version: 17      - run: npm install      - run: mkdir -p www && cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png www/      - run: npx cap add android      - name: Add permissions        run: |          F=android/app/src/main/AndroidManifest.xml          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application|' $F      - run: npx cap sync android      - run: |          cd android          chmod +x gradlew          ./gradlew assembleDebug      - uses: actions/upload-artifact@v4        with:          name: app-debug-apk          path: android/app/build/outputs/apk/debug/app-debug.apk
